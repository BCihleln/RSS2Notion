<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Aggregation Clustering Viewer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        body { margin: 0; padding: 0; background-color: #222222; color: white; font-family: 'Microsoft JhengHei', 'Microsoft YaHei', sans-serif; }
        #mynetwork { width: 100vw; height: 100vh; }
        #overlay { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #444; }
        #overlay h2 { margin: 0 0 10px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #overlay p { margin: 5px 0 10px 0; color: #cccccc; font-size: 14px; }
        .control-group { margin-top: 15px; }
        .control-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type=range] { width: 100%; }
        .threshold-display { color: #32cd32; font-weight: bold; font-size: 16px; margin-top: 5px;}
    </style>
</head>
<body>
    <div id="overlay">
        <h2>Aggregation Clustering</h2>
        <p>粗線且同色：達到動態閾值（同一群組）<br>灰色細線：相似度 > 5% 但未達閾值<br>橘色虛線：點擊節點時，顯示該節點小於 5% 的隱藏弱關聯</p>
        
        <div class="control-group">
            <label for="percentile-slider">Top Percentile: <span id="percentile-label"></span></label>
            <input type="range" id="percentile-slider" min="1" max="100" value="5">
            <div class="threshold-display">Dynamic Threshold: <span id="threshold-label"></span></div>
        </div>
    </div>
    
    <div id="mynetwork"></div>
    
    <!-- Load the data generated by the python script -->
    <script src="clustering_data.js"></script>
    
    <script type="text/javascript">
        checkData: {
            if (typeof graphData === 'undefined') {
                alert("找不到圖表數據！請先執行 uv run tools/visualize_clustering.py 來產生 clustering_data.js");
                break checkData;
            }
        }
        
        
        var container = document.getElementById('mynetwork');
        
        // 初始化 vis.js 的 DataSet
        var nodes = new vis.DataSet(graphData.nodes);
        var edges = new vis.DataSet();
        
        var data = {
            nodes: nodes,
            edges: edges
        };
        
        var options = {
            nodes: { 
                shape: 'dot',
                font: { color: 'white', size: 14 }
            },
            edges: { 
                smooth: { type: 'dynamic' },
                font: { color: 'gray', size: 12, strokeWidth: 0, align: 'horizontal' }
            },
            physics: {
                barnesHut: { gravitationalConstant: -30000, centralGravity: 0.3 }
            },
            interaction: {
                hover: true
            }
        };
        
        var network = new vis.Network(container, data, options);
        
        // 當圖表初次計算完佈局並穩定後，關閉物理引擎，這樣拖動 Slider 就不會讓節點無意義地彈跳
        network.once("stabilizationIterationsDone", function() {
            network.setOptions({ physics: { enabled: false } });
        });
        network.once("stabilized", function() {
            network.setOptions({ physics: { enabled: false } });
        });
        
        var slider = document.getElementById('percentile-slider');
        var percentileLabel = document.getElementById('percentile-label');
        var thresholdLabel = document.getElementById('threshold-label');
        
        var selectedNodeId = null;
        
        // 初始化 Slider 值為 Config 的設定
        if (graphData.percentile) {
            slider.value = Math.max(1, Math.min(100, Math.round(graphData.percentile * 100)));
        }

        function updateGraph() {
            var pValue = parseInt(slider.value, 10);
            percentileLabel.innerText = pValue + "%";
            
            var percentile = pValue / 100.0;
            var cutoffIndex = Math.max(0, Math.ceil(graphData.similarities.length * percentile) - 1);
            var dynamicThreshold = 0.0;
            if (graphData.similarities.length > 0) {
                dynamicThreshold = graphData.similarities[cutoffIndex];
            }
            
            thresholdLabel.innerText = (dynamicThreshold * 100).toFixed(1) + "%";
            
            // 1. Build adjacency list for current threshold
            var adj = {};
            for (var i = 0; i < graphData.nodes.length; i++) {
                adj[graphData.nodes[i].id] = [];
            }
            
            for (var i = 0; i < graphData.edges.length; i++) {
                var edge = graphData.edges[i];
                if (edge.value >= dynamicThreshold) {
                    adj[edge.from].push(edge.to);
                    adj[edge.to].push(edge.from);
                }
            }
            
            // 2. Find Connected Components
            var visited = {};
            var nodeColors = {};
            var clusterCount = 0;
            
            for (var i = 0; i < graphData.nodes.length; i++) {
                var nodeId = graphData.nodes[i].id;
                if (visited[nodeId]) continue;
                
                var queue = [nodeId];
                var component = [];
                visited[nodeId] = true;
                
                while(queue.length > 0) {
                    var curr = queue.shift();
                    component.push(curr);
                    for (var j = 0; j < adj[curr].length; j++) {
                        var neighbor = adj[curr][j];
                        if (!visited[neighbor]) {
                            visited[neighbor] = true;
                            queue.push(neighbor);
                        }
                    }
                }
                
                // 3. Assign distinct colors to clusters
                if (component.length > 1) {
                    // 使用黃金比例 137.5 產生分散的 HSL 顏色
                    var hue = (clusterCount * 137.5) % 360;
                    var color = "hsl(" + hue + ", 75%, 60%)";
                    for (var k = 0; k < component.length; k++) {
                        nodeColors[component[k]] = color;
                    }
                    clusterCount++;
                } else {
                    // 孤立節點（未成群）
                    nodeColors[component[0]] = "#555555"; 
                }
            }
            
            // 4. Update Node Colors
            var newNodes = [];
            for (var i = 0; i < graphData.nodes.length; i++) {
                var n = graphData.nodes[i];
                newNodes.push({
                    id: n.id,
                    color: nodeColors[n.id]
                });
            }
            nodes.update(newNodes); // 用 update 保留現有座標位置
            
            // 5. Update Edges
            var newEdges = [];
            for (var i = 0; i < graphData.edges.length; i++) {
                var edge = graphData.edges[i];
                var isConnected = edge.value >= dynamicThreshold;
                
                var isSelected = selectedNodeId !== null && (edge.from === selectedNodeId || edge.to === selectedNodeId);
                
                if (edge.value > 0.0 && (edge.value >= 0.05 || isConnected || isSelected)) {
                    
                    var width = 0.5;
                    var color = "#444444";
                    var dashes = false;
                    
                    if (isConnected) {
                        width = 3.0;
                        color = nodeColors[edge.from]; // 邊與群組節點同色
                    } else if (edge.value < 0.05 && isSelected) {
                        width = 1.0;
                        color = "#d2691e"; // 橘色表示隱藏邊
                        dashes = true;
                    }
                    
                    newEdges.push({
                        id: i,
                        from: edge.from,
                        to: edge.to,
                        value: edge.value,
                        width: width,
                        color: color,
                        dashes: dashes,
                        title: edge.title,
                        label: edge.label
                    });
                }
            }
            
            edges.clear();
            edges.add(newEdges);
        }
        
        // 綁定事件
        slider.addEventListener('input', updateGraph);
        
        // 處理節點選取與取消選取交互
        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                var clickedNodeId = params.nodes[0];
                if (clickedNodeId === selectedNodeId) {
                    // 再次點選已選中的節點 -> 取消選取
                    network.unselectAll();
                    selectedNodeId = null;
                } else {
                    // 點選新節點
                    selectedNodeId = clickedNodeId;
                }
            } else {
                // 點選空白處
                selectedNodeId = null;
            }
            updateGraph();
        });
        
        // 首次渲染
        updateGraph();
            
    </script>
</body>
</html>
